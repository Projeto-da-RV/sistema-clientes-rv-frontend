<div class="access-denied-container">
  <div class="access-denied-card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" class="access-denied-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <h1 class="title">Acesso Negado</h1>

    <p class="message">
      Você não possui permissão para acessar esta página.
    </p>

    <p class="submessage">
      Entre em contato com o administrador do sistema se você acredita que deveria ter acesso a este recurso.
    </p>

    <div class="actions">
      <button class="btn btn-primary" (click)="goBack()">
        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Voltar ao Dashboard
      </button>

      <button class="btn btn-secondary" (click)="logout()">
        <svg xmlns="http://www.w3.org/2000/svg" class="btn-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Fazer Logout
      </button>
    </div>
  </div>
</div>
