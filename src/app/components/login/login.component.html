<div class="auth-page">

  <!-- Background Gradiente Animado -->
  <div class="gradient-background">
    <svg
      width="100%"
      height="100%"
      viewBox="0 0 800 600"
      fill="none"
      preserveAspectRatio="xMidYMid slice"
    >
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#565add;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#2b1c50;stop-opacity:0.6" />
        </linearGradient>
        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#142a19;stop-opacity:0.9" />
          <stop offset="50%" style="stop-color:#2b1c50;stop-opacity:0.7" />
          <stop offset="100%" style="stop-color:#565add;stop-opacity:0.6" />
        </linearGradient>
        <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#565add;stop-opacity:0.8" />
          <stop offset="100%" style="stop-color:#2b1c50;stop-opacity:0.4" />
        </radialGradient>
        <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="35"/>
        </filter>
        <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="25"/>
        </filter>
        <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="45"/>
        </filter>
      </defs>

      <g class="animate-float-1">
        <ellipse cx="200" cy="500" rx="250" ry="180" fill="url(#grad1)" filter="url(#blur1)" transform="rotate(-30 200 500)"/>
        <rect x="500" y="100" width="300" height="250" rx="80" fill="url(#grad2)" filter="url(#blur2)" transform="rotate(15 650 225)"/>
      </g>

      <g class="animate-float-2">
        <circle cx="650" cy="450" r="150" fill="url(#grad3)" filter="url(#blur3)" opacity="0.7"/>
        <ellipse cx="50" cy="150" rx="180" ry="120" fill="#142a19" filter="url(#blur2)" opacity="0.8"/>
      </g>
    </svg>
  </div>

  <!-- Logo no topo -->
  <div class="logo-header">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="logo-text">RV Digital</h1>
  </div>

  <!-- Conteúdo Central -->
  <div class="main-content">
    <div class="content-wrapper">

      <!-- Título Principal -->
      <div class="hero-section">
        <h1 class="hero-title">
          Bem-vindo ao RV Digital
        </h1>
        <p class="hero-subtitle">
          Gerencie seus serviços com facilidade
        </p>
      </div>

      <!-- Botões de Ação -->
      <div class="action-buttons">
        <button
          (click)="showRegister = false"
          [class.active]="!showRegister"
          class="btn btn-outline">
          <span>Entrar</span>
        </button>

        <button
          (click)="showRegister = true"
          [class.active]="showRegister"
          class="btn btn-primary">
          <span>Criar Conta</span>
        </button>
      </div>

      <!-- Formulário de Login -->
      @if (!showRegister) {
        <div class="form-card">
          <form (ngSubmit)="onLogin()" class="auth-form">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="text"
                [(ngModel)]="username"
                name="username"
                placeholder="seu@email.com"
                class="form-input"
                [disabled]="loading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Senha</label>
              <input
                type="password"
                [(ngModel)]="password"
                name="password"
                placeholder="••••••••"
                class="form-input"
                [disabled]="loading"
                required
              />
            </div>

            <button type="submit" class="btn btn-submit" [disabled]="loading">
              @if (loading) {
                <span class="spinner"></span>
                <span>Entrando...</span>
              } @else {
                <span>Entrar</span>
              }
            </button>
          </form>
        </div>
      }

      <!-- Formulário de Registro -->
      @if (showRegister) {
        <div class="form-card">
          <form (ngSubmit)="onRegister()" class="auth-form">
            <div class="form-group">
              <label class="form-label">Nome Completo</label>
              <input
                type="text"
                [(ngModel)]="registerData.nome"
                name="nome"
                placeholder="Seu nome"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                [(ngModel)]="registerData.email"
                name="email"
                placeholder="seu@email.com"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">CPF</label>
              <input
                type="text"
                [(ngModel)]="registerData.cpf"
                name="cpf"
                placeholder="000.000.000-00"
                (input)="formatarCPF($event)"
                maxlength="14"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Data de Nascimento</label>
              <input
                type="date"
                [(ngModel)]="registerData.dataNascimento"
                name="dataNascimento"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Senha</label>
              <input
                type="password"
                [(ngModel)]="registerData.senha"
                name="senha"
                placeholder="Mínimo 6 caracteres"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Confirmar Senha</label>
              <input
                type="password"
                [(ngModel)]="registerData.confirmarSenha"
                name="confirmarSenha"
                placeholder="Digite a senha novamente"
                class="form-input"
                [disabled]="registerLoading"
                required
              />
            </div>

            <button type="submit" class="btn btn-submit" [disabled]="registerLoading">
              @if (registerLoading) {
                <span class="spinner"></span>
                <span>Criando conta...</span>
              } @else {
                <span>Criar Conta</span>
              }
            </button>
          </form>
        </div>
      }

      <!-- Texto Rodapé -->
      <p class="footer-text">
        Ao continuar, você concorda com nossos
        <a href="#" class="footer-link">Termos de Serviço</a> e
        <a href="#" class="footer-link">Política de Privacidade</a>
      </p>
    </div>
  </div>
</div>
